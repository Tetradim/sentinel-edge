name: macOS Smoke Checks

on:
  push:
    branches: [consolidated, OC-Iteration]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'README.md'
      - '.github/workflows/macos-smoke.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'README.md'
      - '.github/workflows/macos-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    name: macOS Smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run branch static contract tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s backend/tests -p "test_*static.py" 2>&1 | tee macos-static-branch.txt
          exit 0

      - name: Run base static contract tests
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -e
          if [ -n "$PR_BASE_SHA" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            git fetch origin OC-Iteration --depth=1
            BASE_SHA="$(git rev-parse origin/OC-Iteration)"
          fi
          BASE_DIR="$RUNNER_TEMP_DIR/sentinel-edge-static-base"
          rm -rf "$BASE_DIR"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          set +e
          (
            cd "$BASE_DIR"
            python -m unittest discover -s backend/tests -p "test_*static.py"
          ) 2>&1 | tee macos-static-base.txt
          exit 0

      - name: Reject new static contract failures
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          def failures(path: str) -> set[str]:
              text = pathlib.Path(path).read_text(encoding="utf-8", errors="replace")
              pattern = re.compile(r"^(?:FAIL|ERROR): ([^\s]+)", re.MULTILINE)
              return set(pattern.findall(text))

          branch = failures("macos-static-branch.txt")
          base = failures("macos-static-base.txt")
          introduced = sorted(branch - base)
          resolved = sorted(base - branch)
          print(f"Base static failures: {len(base)}")
          print(f"Branch static failures: {len(branch)}")
          if resolved:
              print("Resolved static failures:")
              for name in resolved:
                  print(f"  - {name}")
          if introduced:
              print("New static failures introduced by this branch:")
              for name in introduced:
                  print(f"  - {name}")
              sys.exit(1)
          print("No new static contract failures were introduced.")
          PY

      - name: Upload static test reports
        uses: actions/upload-artifact@v4
        with:
          name: macos-static-test-report
          path: |
            macos-static-branch.txt
            macos-static-base.txt
          if-no-files-found: error
          retention-days: 14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-frontend-dist
          path: frontend/dist
          if-no-files-found: warn
          retention-days: 7
