name: macOS Smoke Checks

on:
  push:
    branches: [consolidated, OC-Iteration]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'README.md'
      - '.github/workflows/macos-smoke.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'README.md'
      - '.github/workflows/macos-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 25
    name: macOS Smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run backend static contract tests
        id: static_tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s backend/tests -p "test_*static.py" 2>&1 | tee macos-static-tests.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload static test report
        uses: actions/upload-artifact@v4
        with:
          name: macos-static-test-report
          path: macos-static-tests.txt
          if-no-files-found: error
          retention-days: 14

      - name: Fail when static tests failed
        if: steps.static_tests.outputs.status != '0'
        run: exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-frontend-dist
          path: frontend/dist
          if-no-files-found: warn
          retention-days: 7
