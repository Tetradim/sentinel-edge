name: Edge Fill Authority

on:
  pull_request:
    branches: [OC-Iteration]
    paths:
      - 'backend/**'
      - '.github/workflows/live-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r backend/requirements-dev.txt
      - name: Run command and handoff tests
        id: tests
        env:
          PYTHONPATH: backend
        shell: bash
        run: |
          set +e
          python -m pytest \
            backend/tests/test_fill_authoritative_automation.py \
            backend/tests/test_live_runtime_wiring.py \
            backend/tests/test_scheduler_handoff_feedback.py \
            backend/tests/test_automation_handoff_metrics.py \
            -q --tb=short 2>&1 | tee edge-fill-authority-tests.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload compact test report
        uses: actions/upload-artifact@v4
        with:
          name: edge-fill-authority-test-report
          path: edge-fill-authority-tests.txt
          if-no-files-found: error
          retention-days: 14
      - name: Fail when tests failed
        if: steps.tests.outputs.status != '0'
        run: exit 1
