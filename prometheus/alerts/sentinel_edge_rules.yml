groups:
  - name: sentinel_edge_alerts
    interval: 30s
    rules:
      # ════════════════════════════════════════════════════════════════
      # CIRCUIT BREAKER ALERTS
      # ════════════════════════════════════════════════════════════════
      
      - alert: CircuitBreakerOpen
        expr: broker_circuit_state{broker_id="pulse"} == 2
        for: 30s
        labels:
          severity: critical
          component: broker
        annotations:
          summary: "Circuit breaker is OPEN for {{ $labels.broker_id }}"
          description: "The circuit breaker for {{ $labels.broker_id }} has been open for 30 seconds, indicating persistent failures in API calls."
          runbook_url: "docs/runbooks/pulse-circuit-breaker.md"
      
      - alert: CircuitBreakerHalfOpen
        expr: broker_circuit_state{broker_id="pulse"} == 1
        for: 1m
        labels:
          severity: warning
          component: broker
        annotations:
          summary: "Circuit breaker is HALF_OPEN for {{ $labels.broker_id }}"
          description: "The circuit breaker is testing if {{ $labels.broker_id }} has recovered."
          runbook_url: "docs/runbooks/pulse-circuit-breaker.md"
      
      # ════════════════════════════════════════════════════════════════
      # TRADING ALERTS
      # ════════════════════════════════════════════════════════════════
      
      - alert: AutoStopTriggered
        expr: increase(edge_decision_total{decision="emergency_exit"}[5m]) > 0
        for: 0s
        labels:
          severity: critical
          component: trading
        annotations:
          summary: "Auto-stop triggered for {{ $labels.symbol }}"
          description: "Emergency exit decision made for {{ $labels.symbol }} due to excessive losses or risk."
          runbook_url: "docs/runbooks/auto-stop-triggered.md"
      
      - alert: ConsecutiveLossesWarning
        expr: edge_consecutive_losses >= 3
        for: 1m
        labels:
          severity: warning
          component: trading
        annotations:
          summary: "{{ $labels.symbol }} has {{ $value }} consecutive losses"
          description: "Ticker {{ $labels.symbol }} has hit {{ $value }} consecutive losses. Risk management may trigger soon."
          runbook_url: "docs/runbooks/consecutive-losses.md"
      
      - alert: ConsecutiveLossesCritical
        expr: edge_consecutive_losses >= 5
        for: 0s
        labels:
          severity: critical
          component: trading
        annotations:
          summary: "CRITICAL: {{ $labels.symbol }} has {{ $value }} consecutive losses"
          description: "Ticker {{ $labels.symbol }} has {{ $value }} consecutive losses. Immediate action required."
          runbook_url: "docs/runbooks/consecutive-losses.md"
      
      # ════════════════════════════════════════════════════════════════
      # BROKER HEALTH ALERTS
      # ════════════════════════════════════════════════════════════════
      
      - alert: BrokerHighFailureRate
        expr: broker_failure_rate > 20
        for: 2m
        labels:
          severity: warning
          component: broker
        annotations:
          summary: "High failure rate for {{ $labels.broker_id }}: {{ $value }}%"
          description: "Broker {{ $labels.broker_id }} has a failure rate of {{ $value }}% over the last 2 minutes."
      
      - alert: BrokerCriticalFailureRate
        expr: broker_failure_rate > 50
        for: 1m
        labels:
          severity: critical
          component: broker
        annotations:
          summary: "CRITICAL failure rate for {{ $labels.broker_id }}: {{ $value }}%"
          description: "Broker {{ $labels.broker_id }} has a critical failure rate of {{ $value }}%. Service degradation likely."
      
      # ════════════════════════════════════════════════════════════════
      # ENGINE HEALTH ALERTS
      # ════════════════════════════════════════════════════════════════
      
      - alert: EngineNotRunning
        expr: edge_engine_running == 0
        for: 1m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: "Sentinel Edge engine is not running"
          description: "The main evaluation engine has stopped. No ticker analysis is being performed."
          runbook_url: "docs/runbooks/engine-not-running.md"

      - alert: EdgeRuntimeNotReady
        expr: edge_readiness_status == 0
        for: 2m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: "Sentinel Edge runtime is not ready"
          description: "Edge has been reporting not-ready for 2 minutes. Check /api/ready for the failing dependency check before enabling automation."
          runbook_url: "docs/runbooks/edge-runtime-not-ready.md"

      - alert: EdgeReadinessCheckFailed
        expr: edge_readiness_check_status == 0
        for: 2m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: "Sentinel Edge readiness check failed: {{ $labels.check }}"
          description: "The {{ $labels.check }} readiness check has been failing for 2 minutes. Check /api/ready and the Edge runtime readiness runbook before enabling automation."
          runbook_url: "docs/runbooks/edge-runtime-not-ready.md"

      - alert: ApiRateLimitRejections
        expr: edge_rate_limit_rejections:rate5m{scope="api"} > 0
        for: 0s
        labels:
          severity: warning
          component: api
        annotations:
          summary: "Sentinel Edge API is rejecting requests"
          description: "The Edge API rejected {{ $value }} requests in the last 5 minutes because the in-memory rate limit was exceeded."
          runbook_url: "docs/runbooks/api-rate-limit-rejections.md"

      - alert: ApiRateLimitBucketPressure
        expr: edge_rate_limit_tracked_clients:max5m > 500
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "Sentinel Edge API rate limiter is tracking many clients"
          description: "Tracked API rate-limit buckets stayed above 500 for at least 5 minutes. This can indicate scan traffic, runaway automation, or a stale bucket pruning regression."
          runbook_url: "docs/runbooks/api-rate-limit-bucket-pressure.md"

      - alert: EdgeAutomationHandoffFailures
        expr: edge_automation_handoffs:rate5m{result="failed"} > 0
        for: 2m
        labels:
          severity: critical
          component: automation
        annotations:
          summary: "Edge automation handoff failures: {{ $labels.action }} {{ $labels.mode }}"
          description: "Edge-to-Pulse handoff delivery has failed for action={{ $labels.action }}, mode={{ $labels.mode }}, reason={{ $labels.reason }} for at least 2 minutes. Pause autonomous handoff and check Pulse connectivity before allowing automation to continue."
          runbook_url: "docs/runbooks/automation-handoff-failures.md"

      - alert: PulseApiSloFastBurn
        expr: edge_api_availability:burn_rate1h > 14.4 and edge_api_availability:burn_rate5m > 14.4
        for: 2m
        labels:
          severity: critical
          component: broker
          slo: pulse-api-availability
        annotations:
          summary: "Pulse API availability error budget is burning fast"
          description: "Pulse API failures are burning the 99% availability budget at >14.4x across both 1h and 5m windows. Check broker health, retries, and circuit breaker state."
          runbook_url: "docs/runbooks/pulse-api-slo-burn.md"

      - alert: PulseApiSloSlowBurn
        expr: edge_api_availability:burn_rate6h > 6 and edge_api_availability:burn_rate30m > 6
        for: 15m
        labels:
          severity: warning
          component: broker
          slo: pulse-api-availability
        annotations:
          summary: "Pulse API availability error budget is burning slowly"
          description: "Pulse API failures are burning the 99% availability budget at >6x across both 6h and 30m windows. Investigate before the dependency becomes a trading reliability issue."
          runbook_url: "docs/runbooks/pulse-api-slo-burn.md"
      
      # ════════════════════════════════════════════════════════════════
      # DRAWDOWN ALERTS
      # ════════════════════════════════════════════════════════════════
      
      - alert: DrawdownWarning
        expr: ticker_drawdown_percent > 5
        for: 2m
        labels:
          severity: warning
          component: risk
        annotations:
          summary: "{{ $labels.symbol }} drawdown at {{ $value }}%"
          description: "Ticker {{ $labels.symbol }} has a drawdown of {{ $value }}%, approaching risk threshold."
          runbook_url: "docs/runbooks/drawdown-risk.md"
      
      - alert: DrawdownCritical
        expr: ticker_drawdown_percent > 10
        for: 1m
        labels:
          severity: critical
          component: risk
        annotations:
          summary: "CRITICAL drawdown for {{ $labels.symbol }}: {{ $value }}%"
          description: "Ticker {{ $labels.symbol }} has exceeded maximum drawdown threshold at {{ $value }}%."
          runbook_url: "docs/runbooks/drawdown-risk.md"
      
      # ════════════════════════════════════════════════════════════════
      # ORB BREAKOUT ALERTS
      # ════════════════════════════════════════════════════════════════
      
      - alert: OrbBreakoutDetected
        expr: increase(edge_orb_breakouts_total[1m]) > 0
        for: 0s
        labels:
          severity: info
          component: signals
        annotations:
          summary: "ORB breakout detected: {{ $labels.symbol }} ({{ $labels.direction }})"
          description: "{{ $labels.symbol }} broke {{ $labels.direction }} on {{ $labels.timeframe }} timeframe."
      
      # ════════════════════════════════════════════════════════════════
      # FRONTEND EXPERIENCE ALERTS
      # ════════════════════════════════════════════════════════════════

      - alert: FrontendRumIngestMissing
        expr: absent_over_time(edge_frontend_rum_samples_total[30m]) or edge_frontend_rum:freshness_seconds > 1800
        for: 15m
        labels:
          severity: warning
          component: frontend
        annotations:
          summary: "Frontend RUM ingestion has stopped"
          description: "No Sentinel Edge browser RUM snapshots have reached Prometheus for at least 30 minutes, or the 15-minute ingest rate is zero."
          runbook_url: "docs/runbooks/frontend-rum-ingest-missing.md"

      - alert: FrontendINPPoor
        expr: edge_frontend_web_vital_value{metric="inp"} > 500
        for: 10m
        labels:
          severity: critical
          component: frontend
        annotations:
          summary: "Poor frontend responsiveness on {{ $labels.route }}"
          description: "INP-style responsiveness is {{ $value }}ms on {{ $labels.route }}, above the poor threshold of 500ms."
          runbook_url: "docs/runbooks/frontend-core-web-vitals.md"

      - alert: FrontendLCPPoor
        expr: edge_frontend_web_vital_value{metric="lcp"} > 4000
        for: 10m
        labels:
          severity: warning
          component: frontend
        annotations:
          summary: "Poor frontend load experience on {{ $labels.route }}"
          description: "Largest Contentful Paint is {{ $value }}ms on {{ $labels.route }}, above the poor threshold of 4000ms."
          runbook_url: "docs/runbooks/frontend-core-web-vitals.md"

      - alert: FrontendCLSPoor
        expr: edge_frontend_web_vital_value{metric="cls"} > 0.25
        for: 10m
        labels:
          severity: warning
          component: frontend
        annotations:
          summary: "Poor frontend layout stability on {{ $labels.route }}"
          description: "Cumulative Layout Shift is {{ $value }} on {{ $labels.route }}, above the poor threshold of 0.25."
          runbook_url: "docs/runbooks/frontend-core-web-vitals.md"

      - alert: FrontendSlowInteractionP95High
        expr: edge_frontend_slow_interaction:p95_ms > 500
        for: 10m
        labels:
          severity: warning
          component: frontend
        annotations:
          summary: "Frontend slow interaction p95 is high on {{ $labels.route }}"
          description: "p95 browser interaction duration is {{ $value }}ms on {{ $labels.route }}, above 500ms."
          runbook_url: "docs/runbooks/frontend-core-web-vitals.md"

      - alert: FrontendRumDroppedMetrics
        expr: increase(edge_frontend_rum_dropped_metrics_total{reason="unknown_metric"}[15m]) > 0
        for: 0s
        labels:
          severity: warning
          component: frontend
        annotations:
          summary: "Frontend RUM metrics are being dropped"
          description: "The Edge backend dropped {{ $value }} frontend RUM metric samples in the last 15 minutes because their metric names were not allow-listed."
          runbook_url: "docs/runbooks/frontend-rum-dropped-metrics.md"

      # ════════════════════════════════════════════════════════════════
      # SIDECAR AVAILABILITY
      # ════════════════════════════════════════════════════════════════
      
      - alert: SidecarDown
        expr: up{job="sentinel-edge"} == 0
        for: 1m
        labels:
          severity: critical
          component: availability
        annotations:
          summary: "Sentinel Edge sidecar is down"
          description: "The Sentinel Edge service is not responding to health checks."
          runbook_url: "docs/runbooks/sidecar-down.md"
