# Advanced Alertmanager Config — Sentinel Edge Trading Stack
# Env vars expanded via --config.expand-env (set in docker-compose command)
#
# Required env vars:
#   WEBHOOK_SECRET          Basic-auth password for /api/webhook/* endpoints
#   TELEGRAM_BOT_TOKEN      Telegram bot token (from @BotFather)
#   TELEGRAM_TRADING_CHAT   Telegram chat_id (integer, use @getidsbot to find)
#   SLACK_WEBHOOK_URL       Slack incoming webhook URL
#   ALERTMANAGER_AUTH       Basic-auth password for Alertmanager's own /api

global:
  resolve_timeout: 5m

# ─────────────────────────────────────────────────────────────────────────────
# ROUTING TREE
# ─────────────────────────────────────────────────────────────────────────────
route:
  group_by: ['alertname', 'direction', 'severity', 'cluster_id']
  receiver: 'default'
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 30m

  routes:

    # 1. Pulse dependency SLO alerts -> human/operator notification only.
    # Keep this before the broad critical route so broker-health alerts never
    # trigger the automated Pulse override webhook.
    - matchers:
        - slo = "pulse-api-availability"
      receiver: 'broker-slo-alerts'
      group_by: ['alertname', 'slo', 'severity']
      group_wait: 20s
      group_interval: 5m
      repeat_interval: 1h
      continue: false

    # 1a. Automation delivery failures -> human/operator notification only.
    # Keep this before the broad critical route so failed handoff delivery does
    # not attempt another Pulse override while Pulse delivery is impaired.
    - matchers:
        - component = "automation"
      receiver: 'automation-alerts'
      group_by: ['alertname', 'action', 'mode', 'reason', 'severity']
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 30m
      continue: false

    # 1. Critical risk events -> immediate Pulse override (no continue)
    - matchers:
        - severity = "critical"
      receiver: 'pulse-override'
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 30m
      continue: false

    # 1b. Edge webhook actions → Sentinel Edge /alerts endpoint
    # Handles BearishClusterOverride, add_ticker, remove_ticker, global_risk_reduction
    - matchers:
        - action = "global_risk_reduction"
      receiver: 'edge-webhook'
      group_wait: 5s
      continue: true
    - matchers:
        - action = "bearish_cluster"
      receiver: 'edge-webhook'
      group_wait: 5s
      continue: true
    - matchers:
        - action = "add_ticker"
      receiver: 'edge-webhook'
      group_wait: 10s
      continue: true
    - matchers:
        - action = "remove_ticker"
      receiver: 'edge-webhook'
      group_wait: 10s
      continue: true

    # 2. Strong / very-high correlation clusters → notify trading team
    - matchers:
        - alertname =~ ".*CorrelationCluster"
        - strength =~ "high|very_high"
      receiver: 'trading-team'
      group_by: ['direction']
      group_wait: 20s
      repeat_interval: 2h
      continue: true
      mute_time_intervals:
        - outside_trading_hours

    # 3. Market regime changes → Telegram + Echo bot
    - matchers:
        - alertname =~ ".*RegimeChange|BullishMomentumRegime"
      receiver: 'regime-alerts'
      group_interval: 15m
      repeat_interval: 4h
      continue: false
      mute_time_intervals:
        - outside_trading_hours

    # 4. Everything else (warnings, info) → default
    - receiver: 'default'

# ─────────────────────────────────────────────────────────────────────────────
# RECEIVERS
# ─────────────────────────────────────────────────────────────────────────────
receivers:

  # Automation alerts are delivery-health signals, not Pulse override commands.
  - name: 'automation-alerts'
    slack_configs:
      - api_url: '$SLACK_WEBHOOK_URL'
        channel: '#trading-alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}Automation Handoff{{ else }}RESOLVED Automation Handoff{{ end }} {{ .GroupLabels.alertname }}'
        text: >-
          *Severity:* {{ .CommonLabels.severity | title }}
          *Action:* {{ .CommonLabels.action }}
          *Mode:* {{ .CommonLabels.mode }}
          *Reason:* {{ .CommonLabels.reason }}
          {{ range .Alerts }}- {{ .Annotations.summary }} Runbook: {{ .Annotations.runbook_url }}{{ end }}
    webhook_configs:
      - url: 'http://sentinel-edge:8001/api/webhook/general'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'sentinel-edge'
            password: '$WEBHOOK_SECRET'

  # Pulse override - calls Sentinel Edge webhook which calls send_override()
  - name: 'pulse-override'
    webhook_configs:
      - url: 'http://sentinel-edge:8001/api/webhook/pulse-override'
        send_resolved: true
        max_alerts: 10
        http_config:
          basic_auth:
            username: 'sentinel-edge'
            password: '$WEBHOOK_SECRET'

  # Sentinel Edge webhook — receives Alertmanager alerts and triggers Pulse actions
  # This handles BearishClusterOverride, global risk reduction, ticker add/remove, etc.
  - name: 'edge-webhook'
    webhook_configs:
      - url: 'http://sentinel-edge:8001/alerts'
        send_resolved: true
        max_alerts: 20
        http_config:
          basic_auth:
            username: 'sentinel-edge'
            password: '$WEBHOOK_SECRET'

  # Trading team — Slack + email
  # Broker SLO alerts are dependency-health signals, not automated risk actions.
  - name: 'broker-slo-alerts'
    slack_configs:
      - api_url: '$SLACK_WEBHOOK_URL'
        channel: '#trading-alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}Pulse API SLO{{ else }}RESOLVED Pulse API SLO{{ end }} {{ .GroupLabels.alertname }}'
        text: >-
          *Severity:* {{ .CommonLabels.severity | title }}
          *SLO:* {{ .CommonLabels.slo }}
          {{ range .Alerts }}- {{ .Annotations.summary }} Runbook: {{ .Annotations.runbook_url }}{{ end }}
    webhook_configs:
      - url: 'http://sentinel-edge:8001/api/webhook/general'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'sentinel-edge'
            password: '$WEBHOOK_SECRET'

  - name: 'trading-team'
    slack_configs:
      - api_url: '$SLACK_WEBHOOK_URL'
        channel: '#trading-alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} {{ .GroupLabels.alertname }}'
        text: >-
          *Direction:* {{ .CommonLabels.direction | title }}
          *Severity:* {{ .CommonLabels.severity | title }}
          {{ range .Alerts }}• {{ .Annotations.summary }}{{ end }}
    webhook_configs:
      - url: 'http://sentinel-edge:8001/api/webhook/general'
        send_resolved: true

  # Regime alerts — Telegram + Sentinel Echo (Discord-style bot)
  - name: 'regime-alerts'
    telegram_configs:
      - bot_token: '$TELEGRAM_BOT_TOKEN'
        chat_id: $TELEGRAM_TRADING_CHAT
        send_resolved: true
        message: |-
          {{ if eq .Status "resolved" }}✅ RESOLVED{{ else }}🔄 REGIME CHANGE{{ end }}
          {{ range .Alerts }}
          *{{ .Labels.alertname }}*
          {{ .Annotations.summary }}
          {{ end }}
    webhook_configs:
      # Sentinel Echo — optional Discord relay bot
      - url: 'http://echo:8000/webhook/regime'
        send_resolved: true

  # Default — general webhook logging
  - name: 'default'
    webhook_configs:
      - url: 'http://sentinel-edge:8001/api/webhook/general'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'sentinel-edge'
            password: '$WEBHOOK_SECRET'

# ─────────────────────────────────────────────────────────────────────────────
# INHIBITION RULES (Smart silencing)
# ─────────────────────────────────────────────────────────────────────────────
inhibit_rules:

  # Suppress the slower Pulse API SLO warning while the fast-burn critical
  # alert is active for the same SLO. This avoids duplicate notifications for
  # the same dependency incident while keeping the critical alert visible.
  - source_matchers:
      - alertname = "PulseApiSloFastBurn"
      - slo = "pulse-api-availability"
    target_matchers:
      - alertname = "PulseApiSloSlowBurn"
      - slo = "pulse-api-availability"
    equal: ['slo']

  # Suppress warnings when a critical fires for the same direction
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['direction', 'symbol_group']

  # Suppress BearishClusterOverride (critical) masking CorrelationBearishCluster (warning)
  - source_matchers:
      - alertname = "BearishClusterOverride"
    target_matchers:
      - alertname = "CorrelationBearishCluster"
    equal: ['direction']

  # Suppress individual symbol breakout noise during a market-wide correlation cluster
  - source_matchers:
      - alertname = "CriticalBearishCorrelation"
    target_matchers:
      - alertname = "SingleSymbolBreakout"
    equal: ['direction']

# ─────────────────────────────────────────────────────────────────────────────
# TIME-BASED MUTING (suppress non-critical alerts outside market hours)
# Critical alerts (pulse-override receiver) are NEVER muted.
# ─────────────────────────────────────────────────────────────────────────────
mute_time_intervals:
  - name: 'outside_trading_hours'
    time_intervals:
      # Before market open (midnight → 9:30 AM ET)
      - times:
          - start_time: '00:00'
            end_time: '09:30'
        weekdays: ['monday:friday']
        location: 'America/New_York'
      # After market close (4:01 PM → midnight ET)
      - times:
          - start_time: '16:01'
            end_time: '24:00'
        weekdays: ['monday:friday']
        location: 'America/New_York'
      # Full weekend
      - weekdays: ['saturday', 'sunday']
