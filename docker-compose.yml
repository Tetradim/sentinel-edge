version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Sentinel Edge — Full LGTM Stack
#   Metrics:  Prometheus  → Grafana
#   Logs:     Promtail    → Loki       → Grafana
#   Traces:   OTLP (OTel) → Tempo      → Grafana
#   Alerts:   Prometheus  → Alertmanager
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Application ────────────────────────────────────────────────────────────

  sentinel-edge:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-edge
    ports:
      - "8001:8001"    # FastAPI + /metrics
      - "8002:8002"    # Standalone analyst Prometheus metrics (optional)
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=sentinel_edge
      - PULSE_API_URL=http://pulse:8002
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8001,http://127.0.0.1:8001}
      - EDGE_TEST_COMMAND_ENDPOINTS_ENABLED=false
      - EDGE_OPERATOR_ACTION_SECRET=${EDGE_OPERATOR_ACTION_SECRET:?EDGE_OPERATOR_ACTION_SECRET is required for manual Pulse action endpoints}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_SERVICE_NAME=sentinel-edge
      # Set to "true" to spin up a dedicated metrics server on :8002
      - ANALYST_START_METRICS_SERVER=false
      # Required: basic-auth password for Alertmanager action webhooks.
      # Must match the password expanded into prometheus/alertmanager.yml.
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?WEBHOOK_SECRET is required for Alertmanager action webhooks}
      - RETRY_QUEUE_LOG_DIR=/app/logs
    volumes:
      - ./backend:/app
      - sentinel-edge-logs:/app/logs
    depends_on:
      - mongodb
      - tempo
    networks:
      - sentinel-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/live"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    labels:
      logging: "promtail"
      service: "sentinel-edge"

  # ── Data ───────────────────────────────────────────────────────────────────

  mongodb:
    image: mongo:7.0
    container_name: sentinel-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - sentinel-net
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    # Replica set required for Change Streams
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-init:
    image: mongo:7.0
    container_name: sentinel-mongodb-init
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - sentinel-net
    # One-shot: initialise replica set so Change Streams work
    entrypoint: >
      mongosh --host mongodb:27017 --eval
      "try { rs.status() } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}) }"
    restart: "no"

  # ── Metrics ────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sentinel-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    networks:
      - sentinel-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: sentinel-alertmanager
    ports:
      - "9093:9093"
    # Env vars for webhook auth + notification channels
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?WEBHOOK_SECRET is required for Alertmanager action webhooks}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_TRADING_CHAT=${TELEGRAM_TRADING_CHAT:-0}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-http://placeholder/no-slack}
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      # Expands $ENV_VAR placeholders in alertmanager.yml at startup
      - '--config.expand-env'
      - '--web.listen-address=:9093'
    networks:
      - sentinel-net
    restart: unless-stopped

  # ── Logs ───────────────────────────────────────────────────────────────────

  loki:
    image: grafana/loki:2.9.7
    container_name: sentinel-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - sentinel-net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.7
    container_name: sentinel-promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/docker-config.yaml
    depends_on:
      - loki
    networks:
      - sentinel-net
    restart: unless-stopped

  # ── Traces ─────────────────────────────────────────────────────────────────

  tempo:
    image: grafana/tempo:2.4.1
    container_name: sentinel-tempo
    ports:
      - "3200:3200"     # Tempo UI / query
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP  ← backend sends traces here
    volumes:
      - tempo-data:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]
    # Inline minimal Tempo config
    configs:
      - source: tempo_config
        target: /etc/tempo.yaml
    networks:
      - sentinel-net
    restart: unless-stopped

  # ── Observability UI ───────────────────────────────────────────────────────

  grafana:
    image: grafana/grafana:10.4.2
    container_name: sentinel-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=sentinel123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - sentinel-net
    restart: unless-stopped

# ── Configs (inline) ──────────────────────────────────────────────────────────

configs:
  tempo_config:
    content: |
      server:
        http_listen_port: 3200
      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
      ingester:
        max_block_duration: 5m
      compactor:
        compaction:
          block_retention: 48h
      storage:
        trace:
          backend: local
          wal:
            path: /var/tempo/wal
          local:
            path: /var/tempo/blocks
      query_frontend:
        search:
          duration_slo: 5s
          throughput_bytes_slo: 1.073741824e+09
        trace_by_id:
          duration_slo: 5s

# ── Networks & Volumes ────────────────────────────────────────────────────────

networks:
  sentinel-net:
    driver: bridge

volumes:
  mongodb-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  sentinel-edge-logs:
